<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you</title>

    <style>
        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'DM Sans', sans-serif;

            background:
            linear-gradient(rgba(50, 20, 20, 0.65),
            rgba(50,20,20,0.65)),
            url("images/te1.jpeg");

            background-size: cover;
            background-position: center;
        }

        .thankyou-box{
            max-width: 700px;
            width: 90%;
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
        }

        .icon{
            width: 90px ;
            height: 90px;
            margin: auto;
            background: #7c4d4d;
            color: white;
            border-radius:50% ;
            display: flex;
            justify-content:center ;
            align-items: center;
            font-size: 40px;
            margin-bottom: 25px;
        }

        h1{
            color: #4d2d2d;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p{
            color: #555;
            line-height:1.8 ;
            margin-bottom: 1.1rem;
        }

        .btn{
            display: inline-block;
            margin-top: 30px;
            text-decoration:none ;
            background: #7c4d4d;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: 3s;
        }

        .btn:hover{
            background: #633939;
        }

        @media(max-width:768px){
            h1{
                font-size: 2rem;
            }

            p{
                font-size: 1rem;
            }

            .thankyou-box{
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="thankyou-box">
        <div class="icon">✔️</div>
        <h1>Thank You!</h1>
        <p>
            Your message has been received successfully.
            A member of the Therapy Haven team will get back to you as soon 
            as possible.
        </p>

        <p>
            Thank you trusting us with your journey toward healing 
            and growth.
        </p>

        <a href="index.html" class="btn">
            Return Home
        </a>

    </div>
    
</body>
</html>
